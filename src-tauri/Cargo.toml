[package]
name = "instanceharbor"
version = "1.1.0"
edition = "2021"
default-run = "InstanceHarbor"
[features]
# Keep the debug profile for acceptance while disabling its inspector.
acceptance-ui = []
development-channel = []
[[bin]]
name = "InstanceHarbor"
path = "src/main.rs"
[[bin]]
name = "InstanceHarborDev"
path = "src/main.rs"
required-features = ["development-channel"]
[[bin]]
name = "instanceharbor-acceptance"
path = "src/main.rs"
required-features = ["acceptance-ui"]
[build-dependencies]
tauri-build = "=2.6.3"
[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=1.1.5"
flate2 = "=1.1.10"
crc32fast = "=1.5.1"
# The resident Manager draws its own notification-area icon without a webview.
# Pinned to the version tauri uses, so both share one build.
tray-icon = { version = "=0.24.2", default-features = false }
[profile.dev]
debug = 0
incremental = false

[profile.release]
# Function names and line numbers in the PDB, which stays on the build machine and is
# never shipped, so stacks of a running Manager can be read (#118). MSVC keeps debug
# information out of the executables, so they do not grow.
debug = "line-tables-only"

[profile.dev-channel]
inherits = 'release'
