[package]
name = "instanceharbor-v2"
version = "1.0.0-rc2"
edition = "2021"
default-run = "InstanceHarbor"
[features]
# Keep the debug profile for acceptance while disabling its inspector.
acceptance-ui = []
development-channel = []
[[bin]]
name = "InstanceHarbor"
path = "src/main.rs"
[[bin]]
name = "InstanceHarborDev"
path = "src/main.rs"
required-features = ["development-channel"]
[[bin]]
name = "instanceharbor-v2-acceptance"
path = "src/main.rs"
required-features = ["acceptance-ui"]
[build-dependencies]
tauri-build = "=2.6.3"
[dependencies]
tauri = "=2.11.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=1.1.5"
flate2 = "=1.1.10"
crc32fast = "=1.5.1"
[profile.dev]
debug = 0
incremental = false

[profile.dev-channel]
inherits = 'release'
