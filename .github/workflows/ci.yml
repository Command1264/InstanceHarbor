# Build and test on Windows x64 and Windows ARM64 (#122), then build and check the release
# ZIP and Setup of each architecture (#66). No secrets, no releases, no signing, no uploads. docs/development.md ("CI") explains each step and how to run it locally.
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Released 2026-11-10.
  NODE_VERSION: 24.22.3
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Rust 1.100.0, released 2026-11-12. Pinned so a new stable release cannot add clippy
      # lints that are not in src-tauri/clippy-baseline.json; change both together.
      RUSTUP_TOOLCHAIN: 1.100.0-${{ matrix.target }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile $installer
            & $installer -y --default-toolchain none --profile minimal --no-modify-path
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed with exit code $LASTEXITCODE" }
            $bin = Join-Path $env:USERPROFILE '.cargo\bin'
            $bin >> $env:GITHUB_PATH
            $env:PATH = "$bin;$env:PATH"
          }
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed with exit code $LASTEXITCODE" }
          rustc -vV
          $hostLine = rustc -vV | Select-String '^host: '
          if ("$hostLine" -ne "host: ${{ matrix.target }}") { throw "Expected a ${{ matrix.target }} host toolchain, got '$hostLine'." }

      - name: Cache Cargo downloads and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Use a long-form temporary folder
        # The runner's TEMP is an 8.3 short path (C:\Users\RUNNER~1\...). Development-channel
        # tests exempt fixtures only under the temporary folder, and the long form the code
        # compares does not start with the short one. Expand TEMP to its long form in place;
        # moving it to RUNNER_TEMP on drive D: breaks the file-in-use tests on x64.
        run: |
          Add-Type -Namespace Native -Name Path -MemberDefinition @'
          [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
          public static extern uint GetLongPathName(string shortPath, System.Text.StringBuilder longPath, uint length);
          '@
          $buffer = New-Object System.Text.StringBuilder 1024
          if ([Native.Path]::GetLongPathName($env:TEMP, $buffer, $buffer.Capacity) -eq 0) { throw "GetLongPathName failed for TEMP." }
          $long = $buffer.ToString()
          "TEMP: $env:TEMP -> $long"
          "TEMP=$long" >> $env:GITHUB_ENV
          "TMP=$long" >> $env:GITHUB_ENV

      - name: npm ci
        run: npm ci

      - name: Type check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Vite build (release)
        run: npx vite build

      - name: Vite build (development channel)
        run: npx vite build --mode development-channel --outDir dist-dev

      - name: Front-end tests
        run: node --test src/*.test.mjs

      - name: Script tests
        run: node --test scripts/*.test.mjs

      - name: cargo test (release channel)
        working-directory: src-tauri
        run: cargo test --locked

      - name: cargo test (development channel)
        working-directory: src-tauri
        run: cargo test --locked --features development-channel

      - name: cargo clippy compared with the baseline
        working-directory: src-tauri
        run: |
          $json = Join-Path $env:RUNNER_TEMP 'clippy.json'
          cargo clippy --locked --all-targets --message-format=json-diagnostic-rendered-ansi > $json
          $clippyExit = $LASTEXITCODE
          # Show the rendered warnings in the log, then compare them with the baseline.
          Get-Content $json | ConvertFrom-Json | Where-Object { $_.reason -eq 'compiler-message' } | ForEach-Object { $_.message.rendered }
          if ($clippyExit -ne 0) { throw "cargo clippy failed with exit code $clippyExit" }
          node ../scripts/clippy-baseline.mjs check $json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download the pinned NSIS 3.13 and ConPTY package
        # Both are checked against their pinned SHA-256 before use. NSIS is not on windows-latest,
        # and windows-11-arm has an older one; Setup is built with 3.13 everywhere.
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'package-tools'
          New-Item -ItemType Directory -Path $tools | Out-Null
          function Get-Pinned([string]$Url, [string]$Path, [string]$Sha256) {
            curl.exe --fail --silent --show-error --location --retry 3 --output $Path $Url
            if ($LASTEXITCODE -ne 0) { throw "Download failed ($LASTEXITCODE): $Url" }
            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash
            if ($actual -ne $Sha256) { throw "SHA-256 mismatch for $Url`: $actual" }
          }
          # The official installer that docs/windows-distribution-licenses.md pins.
          $installer = Join-Path $tools 'nsis-3.13-setup.exe'
          Get-Pinned 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13-setup.exe' $installer 'db9a1038bbc0e53fef24f423fd609979bd578e942f1be1198db186d1c42652a3'
          $nsis = Join-Path $tools 'nsis'
          $run = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$nsis" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The NSIS installer exited with $($run.ExitCode)." }
          $makensis = Join-Path $nsis 'makensis.exe'
          $nsisVersion = (& $makensis /VERSION | Out-String).Trim()
          if ($nsisVersion -ne 'v3.13') { throw "Expected NSIS v3.13, got '$nsisVersion'." }
          $record = Get-Content -Raw packaging/console-runtime.json | ConvertFrom-Json
          $conpty = Join-Path $tools ([IO.Path]::GetFileName($record.source.url))
          Get-Pinned $record.source.url $conpty $record.source.sha256
          "IH_CI_MAKENSIS=$makensis" >> $env:GITHUB_ENV
          "IH_CI_CONPTY=$conpty" >> $env:GITHUB_ENV

      - name: Setup decision tests (NSIS)
        run: ./tests/verify-windows-setup-version.ps1 -Compiler $env:IH_CI_MAKENSIS

      - name: Release ZIP and Setup for ${{ matrix.arch }} (built, checked, installed, not published)
        run: ./packaging/verify-ci-package.ps1 -Architecture ${{ matrix.arch }} -ConsoleRuntimePackage $env:IH_CI_CONPTY -Compiler $env:IH_CI_MAKENSIS -Output (Join-Path $env:RUNNER_TEMP 'package') -Install
